# Render Blueprint: Render reads this file when you choose New > Blueprint and pick your repo.
# The database is NOT hosted here (Render has no managed MySQL): create a free MySQL on
# Aiven, TiDB Cloud or Railway, then fill in the DB_* values in the Render dashboard.
services:
  - type: web
    name: energypro
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 1 worker process with 4 threads: enough for one ESP32 + a few dashboard users.
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 60
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: TZ                    # show times in Indian time (Render servers use UTC)
        value: Asia/Kolkata
      - key: BEHIND_PROXY
        value: "1"
      - key: SECRET_KEY            # Render generates a random value
        generateValue: true
      - key: DEVICE_KEY            # same value as DEVICE_KEY in the ESP32 firmware
        sync: false
      - key: ADMIN_PASSWORD        # dashboard password
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL_CA             # path to the provider's CA file, e.g. ca.pem (see README)
        sync: false
